      // Polyfill/shim window.fetch setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var origFetch = window.fetch;
          var _f = origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _f;
              },
              set: function(fn) {
                _f = fn;
              }
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return _f;
                  },
                  set: function(fn) {
                    _f = fn;
                  }
                });
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
    </script>
